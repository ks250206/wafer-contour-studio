    "vitest@5.1.0>vite": "1.5.0"
    "@vitest/mocker@5.1.0>vite": "1.5.0"
    "@tailwindcss/vite@4.3.4>vite": "1.5.0"
    "@vitejs/plugin-react@6.2.1>vite": "1.5.0"

patchedDependencies:
  "@observablehq/plot@0.6.18": patches/@observablehq__plot@0.6.18.patch
